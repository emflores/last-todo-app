name: Build distributables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64

          - name: macOS x64
            os: macos-15-intel
            platform: mac
            arch: x64

          - name: macOS Apple Silicon
            os: macos-15
            platform: mac
            arch: arm64

          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "v${package_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${package_version}."
            exit 1
          fi

      - name: Check
        run: |
          npm run lint
          npm test

      - name: Configure code signing
        shell: bash
        env:
          SIGNING_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          SIGNING_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          if [ -n "${SIGNING_LINK}" ]; then
            echo "CSC_LINK=${SIGNING_LINK}" >> "${GITHUB_ENV}"
            if [ -n "${SIGNING_PASSWORD}" ]; then
              echo "CSC_KEY_PASSWORD=${SIGNING_PASSWORD}" >> "${GITHUB_ENV}"
            fi
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "${GITHUB_ENV}"
          fi

      - name: Build distributables
        run: npm run build -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: lasttodo-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          duplicate_names="$(find artifacts -type f -printf '%f\n' | sort | uniq -d)"
          if [ -n "${duplicate_names}" ]; then
            echo "Release assets must have unique names:"
            echo "${duplicate_names}"
            exit 1
          fi

          mapfile -d '' release_assets < <(find artifacts -type f -print0)
          if [ "${#release_assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded."
            exit 1
          fi

          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --generate-notes \
              --verify-tag
          fi

          gh release upload "${GITHUB_REF_NAME}" "${release_assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
